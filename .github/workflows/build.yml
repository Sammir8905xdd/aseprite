name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        ui: [gui]
        scripting: [lua]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    # --- INSTALACIÓN OBLIGATORIA DE OPENSSL EN WINDOWS ---
    - name: Install OpenSSL (Windows)
      shell: powershell
      run: |
        choco install openssl --version 3.1.0 -y --no-progress
    
    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - uses: aseprite/get-ninja@main
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=off
        export laf_backend=skia
        export enable_scripting=on
        export skia_arch=x64
        
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DENABLE_CCACHE=$enable_ccache \
          -DLAF_BACKEND=$laf_backend \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

    - name: Compiling
      shell: bash
      run: |
        cd build && ninja

    # --- RECOLECCIÓN DE DEPENDENCIAS (SOLO WINDOWS) ---
    - name: Collect Dependencies (Windows)
      shell: powershell
      run: |
        $binDir = "./build/bin/"
        $cryptoName = "libcrypto-3-x64.dll"
        $sslName = "libssl-3-x64.dll"
        
        # Copiar desde la instalación oficial de OpenSSL
        $chocoPath = "C:\Program Files\OpenSSL-Win64\bin\"
        if (Test-Path "$chocoPath$cryptoName") {
            Write-Host "Copiando $cryptoName desde instalación oficial..."
            Copy-Item "$chocoPath$cryptoName" $binDir -Force
            Copy-Item "$chocoPath$sslName" $binDir -Force
        }

        # Búsqueda de otras DLLs generadas en el build
        $repoDlls = Get-ChildItem -Path . -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notlike "*skia*" }
        foreach ($dll in $repoDlls) {
            Copy-Item -Path $dll.FullName -Destination $binDir -Force -ErrorAction SilentlyContinue
        }

        # Verificación obligatoria para que no falle al abrir
        if (-not (Test-Path "$binDir$cryptoName")) {
             Write-Error "¡Error crítico: No se encontró $cryptoName!"
             exit 1
        }

    - name: Uploading Aseprite Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-Only
        path: |
          build/bin/aseprite.exe
          build/bin/*.dll
          build/bin/data/**
        if-no-files-found: error
        retention-days: 7
