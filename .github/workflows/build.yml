name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        ui: [gui]
        scripting: [lua]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - uses: aseprite/get-ninja@main
    
    # --- CARGAMOS EL ENTORNO DE VISUAL STUDIO PRIMERO ---
    - uses: ilammy/msvc-dev-cmd@v1

    # --- AHORA COMPILAMOS OPENSSL (SIN TESTS PARA QUE SEA RÁPIDO Y NO FALLE) ---
    - name: Compile OpenSSL from Source
      shell: powershell
      run: |
        choco install strawberryperl -y --no-progress
        git clone --depth 1 --branch openssl-3.1.0 https://github.com/openssl/openssl.git openssl-src
        cd openssl-src
        # 'no-tests' evita el error que tuviste y ahorra mucho tiempo
        perl Configure VC-WIN64A no-tests shared --prefix=$PWD/dist --openssldir=$PWD/dist
        nmake
        nmake install_sw
        $binDir = "../../build/bin/"
        if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Path $binDir }
        Copy-Item "./dist/bin/*.dll" $binDir -Force

    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=off
        export laf_backend=skia
        export enable_scripting=on
        export skia_arch=x64
        
        # CAMBIO CRÍTICO: USE_SHARED_CURL=OFF
        # Esto hace que Aseprite use su propio CURL interno (que siempre funciona)
        # pero lo enlazamos con nuestro OpenSSL compilado manualmente.
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DENABLE_CCACHE=$enable_ccache \
          -DLAF_BACKEND=$laf_backend \
          -DUSE_SHARED_CURL=OFF \
          -DOPENSSL_ROOT_DIR=$(realpath openssl-src/dist) \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

    - name: Compiling Aseprite
      shell: bash
      run: |
        cd build && ninja

    - name: Uploading Aseprite Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-Custom-OpenSSL
        path: |
          build/bin/aseprite.exe
          build/bin/*.dll
          build/bin/data/**
        if-no-files-found: error
        retention-days: 7
