name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        ui: [gui]
        scripting: [lua]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - uses: aseprite/get-ninja@main
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=off
        export laf_backend=skia
        export enable_scripting=on
        export skia_arch=x64
        
        # EXPLICACIÓN DE LOS CAMBIOS:
        # -DUSE_SHARED_CURL=OFF: Compila curl de forma estática (quita dependencia de libcrypto dll)
        # -DENABLE_UPDATER=OFF: Quita el buscador de actualizaciones que usa red y pide SSL
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DENABLE_CCACHE=$enable_ccache \
          -DLAF_BACKEND=$laf_backend \
          -DUSE_SHARED_CURL=OFF \
          -DENABLE_UPDATER=OFF \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

    - name: Compiling
      shell: bash
      run: |
        cd build && ninja

    - name: Collect Dependencies (Windows)
      shell: powershell
      run: |
        $binDir = "./build/bin/"
        # Ya no buscamos libcrypto en el sistema porque ahora es estático
        # Solo recolectamos las DLLs que el compilador haya generado legítimamente
        $repoDlls = Get-ChildItem -Path . -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notlike "*skia*" }
        foreach ($dll in $repoDlls) {
            Copy-Item -Path $dll.FullName -Destination $binDir -Force -ErrorAction SilentlyContinue
        }

    - name: Uploading Aseprite Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-Static
        path: |
          build/bin/aseprite.exe
          build/bin/*.dll
          build/bin/data/**
        if-no-files-found: error
        retention-days: 7
