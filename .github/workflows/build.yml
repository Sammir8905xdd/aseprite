name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo]
        ui: [gui]
        scripting: [lua]
    steps:
    # --- DESCARGAR CÓDIGO FUENTE ESPECÍFICO v1.3.16.1 ---
    - name: Download Aseprite v1.3.16.1 Source
      shell: bash
      run: |
        curl -L -o aseprite-source.zip https://github.com/aseprite/aseprite/releases/download/v1.3.16/Aseprite-v1.3.16.1-Source.zip
        unzip aseprite-source.zip -d .

    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - uses: aseprite/get-ninja@main
    
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=off
        export laf_backend=skia
        export enable_scripting=on
        export skia_arch=x64
        
        # Eliminamos la referencia a openssl-src y usamos la del sistema
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DENABLE_CCACHE=$enable_ccache \
          -DLAF_BACKEND=$laf_backend \
          -DUSE_SHARED_CURL=OFF \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

    - name: Compiling Aseprite
      shell: bash
      run: |
        cd build && ninja

    - name: Uploading Aseprite Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-v1.3.16.1-Windows
        path: |
          build/bin/aseprite.exe
          build/bin/data/**
        if-no-files-found: error
        retention-days: 7
