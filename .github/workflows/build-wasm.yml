name: Build Aseprite WASM

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.39
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build script executable
        run: |
          # Basado en tu log, el archivo está en web_trial/build.sh
          chmod +x web_trial/build.sh

      - name: Run build script
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set -x
          # Ejecutamos el script correcto
          ./web_trial/build.sh

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-web-trial-built
          # Nota: Asegúrate de que el script genere el .zip en esta ruta
          # o ajusta esta ruta a lo que realmente genere tu script.
          path: web_trial/aseprite-web-trial-built.zip
