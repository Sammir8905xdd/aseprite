name: Build Aseprite WASM

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Usamos el contenedor de Emscripten como solicitaste
    container: emscripten/emsdk:3.1.39
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x web_trial/build.sh

      - name: Run build script
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set -x
          # Ejecutamos el script de construcción
          ./web_trial/build.sh
          
          echo "--- REVISIÓN DE ARCHIVOS GENERADOS ---"
          # Listamos la raíz para ver dónde quedó el ZIP
          ls -lh
          # Buscamos archivos .wasm para ver si se compilaron realmente
          find . -name "*.wasm"

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-web-trial-built
          # Ajustado al nombre que tu script mostró en el log (aseprite-web-trial.zip)
          # Si el archivo queda en la raíz, la ruta es solo el nombre.
          path: aseprite-web-trial.zip
          # Si el archivo anterior no existe, intentará subir todo el contenido de web_trial
          if-no-files-found: warn
