name: Build Aseprite WASM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Run the job inside the emsdk container to avoid Docker-in-Docker complexity
    container: emscripten/emsdk:3.1.39
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: list repo files
        run: |
          echo "Listing workspace root and web_trial/build"
          ls -la
          ls -la web_trial || true
          ls -la web_trial/build || true

      - name: Make build scripts executable
        run: |
          chmod +x web_trial/build/build_wasm.sh || true
          chmod +x web_trial/build/package_web.sh || true

      - name: Run build_wasm.sh inside emsdk container
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set -x
          # build_wasm.sh expects to be run where /workspaces/aseprite is writable
          ./web_trial/build/build_wasm.sh || true

      - name: Package web trial
        run: |
          ./web_trial/build/package_web.sh || true

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-web-trial-built
          path: web_trial/aseprite-web-trial-built.zip
