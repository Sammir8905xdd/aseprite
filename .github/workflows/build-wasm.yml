name: Build Aseprite WASM

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.39
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Aseprite necesita sus submódulos para compilar

      - name: Make build script executable
        run: chmod +x web_trial/build.sh

      - name: Run build script
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          set -x
          # Entramos a la carpeta para ejecutarlo desde ahí
          cd web_trial
          ./build.sh
          
          echo "--- CONTENIDO DE WEB_TRIAL ---"
          ls -lh
          # Buscamos el wasm aquí adentro
          find . -name "*.wasm"

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-web-trial-built
          # Ajustamos la ruta: el archivo está DENTRO de web_trial
          path: web_trial/aseprite-web-trial.zip
          if-no-files-found: error
