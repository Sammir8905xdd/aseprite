name: Build Aseprite WASM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: list repo files
        run: |
          echo "Listing workspace root and web_trial/build"
          ls -la
          ls -la web_trial || true
          ls -la web_trial/build || true

      - name: Build emsdk Docker image (use web_trial as context)
        run: |
          # Use web_trial as the build context so Docker can access build/* files
          docker build -t aseprite-wasm -f web_trial/build/emsdk.Dockerfile web_trial

      - name: Run build inside container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspaces/aseprite aseprite-wasm /bin/bash -lc "chmod +x /usr/local/bin/build_wasm.sh && /usr/local/bin/build_wasm.sh"

      - name: Package web trial (inside Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspaces/aseprite aseprite-wasm /bin/bash -lc "chmod +x /workspaces/aseprite/web_trial/build/package_web.sh && /workspaces/aseprite/web_trial/build/package_web.sh"

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-web-trial-built
          path: web_trial/aseprite-web-trial-built.zip
